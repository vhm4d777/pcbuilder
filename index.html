<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="PC Builder AI: подбор комплектующих, 3D-модель ПК, готовые ПК, ноутбуки, периферия и б/у.">
<style>*{box-sizing:border-box}html,body{margin:0}</style>
</head>
<body>
<title>PC Builder AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: pitch + brief form on top; below it a build sheet: parts list on the left, sticky manifest (total, compatibility, AI note) on the right. */
:root{
  --bg:#E8ECF1; --panel:#FFFFFF; --panel2:#F2F5F8; --ink:#101A24; --ink2:#4B5967; --line:#D3DAE2;
  --accent:#2D4BFF; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF; --accent-text:#2339C9;
  --ok:#0F7A49; --ok-bg:#DFF3E8; --warn:#8F5600; --warn-bg:#FFEFCF; --bad:#B3261E; --bad-bg:#FCE3E0;
  --overlay:rgba(8,14,20,.5);
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --panel:#141C25; --panel2:#1A2430; --ink:#E7ECF1; --ink2:#9AA9B8; --line:#263341;
    --accent:#8DA1FF; --accent-ink:#0C1218; --accent-soft:#1D2650; --accent-text:#A9B8FF;
    --ok:#5ED79C; --ok-bg:#12352A; --warn:#F2BC55; --warn-bg:#3B2D0F; --bad:#FF9188; --bad-bg:#401B19;
    --overlay:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --panel:#141C25; --panel2:#1A2430; --ink:#E7ECF1; --ink2:#9AA9B8; --line:#263341;
  --accent:#8DA1FF; --accent-ink:#0C1218; --accent-soft:#1D2650; --accent-text:#A9B8FF;
  --ok:#5ED79C; --ok-bg:#12352A; --warn:#F2BC55; --warn-bg:#3B2D0F; --bad:#FF9188; --bad-bg:#401B19;
  --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.logo{display:flex;align-items:center;gap:10px;font:700 15px var(--display);letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.logo svg{color:var(--accent)}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink2)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,580px);gap:48px;align-items:start;padding-block:28px 36px}
.hero h1{font:500 clamp(26px,3.3vw,40px)/1.14 var(--display);letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.hero .lead{color:var(--ink2);font-size:17px;max-width:46ch;margin:0 0 28px}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:420px;counter-reset:s}
.flow li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-weight:500}
.flow li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-size:12.5px;font-weight:600}
.flow li:last-child{border-bottom:1px solid var(--line)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.form{padding:22px;display:grid;gap:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-size:13px;font-weight:500;color:var(--ink2)}
.inp{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--accent)}
.budget{display:grid;gap:8px}
.budget .num{display:flex;align-items:center;gap:8px}
.budget .num .inp{font-weight:600;font-size:18px;height:46px;font-variant-numeric:tabular-nums}
.budget .cur{font-weight:600;color:var(--ink2);min-width:38px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.rng{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rate{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.rate .inp{height:40px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.ex{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.ex button{border:0;background:none;padding:0;text-align:left;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.go{height:48px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.go[disabled]{opacity:.75;cursor:progress}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* result */
.res-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;margin-bottom:16px}
.res-head h2{font:500 22px var(--display);letter-spacing:-.015em;margin:0}
.res-head p{margin:0;color:var(--ink2);font-size:14px}
.build{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;align-items:start}
.slot{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:6px 18px;padding:18px 20px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.thumb{width:88px;height:88px;border-radius:10px;background:var(--panel2);display:grid;place-items:center}
.thumb svg{width:64px;height:64px}
.info{min-width:0}
.cat{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;font-size:16.5px;line-height:1.3;margin:2px 0 6px;overflow-wrap:anywhere}
.specs{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:13px}
.specs span{color:var(--ink)}
.specs i{font-style:normal;color:var(--ink2);margin-right:5px}
.act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:150px}
.price{font:600 19px var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.pri{border-color:var(--accent);color:var(--accent-text)}
.btn:hover{background:var(--panel2)}
.alt{display:flex;gap:4px 12px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px;color:var(--ink2)}
.alt a{color:var(--ink2)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}

.sum{padding:22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
.sum h3{font-size:13px;font-weight:500;color:var(--ink2);margin:0 0 4px}
.total{font:500 32px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}
.bar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
.bar.over>div{background:var(--bad)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--ink2)}
.kv b{font-weight:600;text-align:right}
.kv .neg{color:var(--bad)}
.hr{height:1px;background:var(--line);margin:18px 0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.chk{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.chk li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13.5px;line-height:1.4}
.chk svg{margin-top:2px}
.chk .ok svg{color:var(--ok)} .chk .warn svg{color:var(--warn)} .chk .error svg{color:var(--bad)}
.chk .error{color:var(--bad);font-weight:500}
.fix{margin-top:12px;width:100%;justify-content:center;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.fix:hover{background:var(--accent)}
.ai h3{display:flex;align-items:center;gap:8px}
.ai p{margin:6px 0 0;font-size:14px;line-height:1.55}
.ai .note{color:var(--ink2);font-size:12.5px}
.ai .think{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.acts .btn{flex:1;justify-content:center}
.disc{margin:20px 0 0;color:var(--ink2);font-size:13px;max-width:90ch;padding-bottom:40px}

.stack{display:grid;gap:24px;min-width:0}
.viewer{overflow:hidden}
.vh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.vh h3{margin:0;font:500 16px var(--display);letter-spacing:-.01em}
.views{display:flex;gap:6px;flex-wrap:wrap}
.chip.sm,.btn.sm{padding:4px 10px;font-size:13px;height:auto;min-height:30px}
.stage{position:relative;height:clamp(320px,44vw,520px);background:radial-gradient(ellipse at 50% 30%,var(--panel2),var(--bg));touch-action:pan-y}
.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1;display:grid;place-items:center}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2)}
.vctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 28px;padding:16px 20px;border-top:1px solid var(--line)}
.vctl .grp{display:grid;gap:8px;align-content:start;min-width:0}
.vctl .lbl{font-size:13px;font-weight:500;color:var(--ink2)}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw>button:not(.btn),.sw .cu{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;flex:none}
.sw>button[aria-pressed="true"]:not(.btn){outline:2px solid var(--accent);outline-offset:2px}
.sw .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-text)}
.sw .cu{position:relative;overflow:hidden;background:conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33);cursor:pointer}
.sw .cu input{position:absolute;inset:-8px;width:44px;height:44px;opacity:0;cursor:pointer}
.lm{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:grid;gap:8px}
.tg label{display:flex;align-items:center;gap:8px;font-size:14px}
.vctl select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;max-width:100%}
.vnote{grid-column:1 / -1;font-size:12.5px;color:var(--ink2);margin:0}
.vhint{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;font-size:13.5px;background:var(--accent-soft);color:var(--accent-text);padding:10px 12px;border-radius:8px}
.vhint .btn{border-color:var(--accent);color:var(--accent-text)}

/* swap drawer */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(580px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h3{font:500 18px var(--display);margin:0;letter-spacing:-.01em}
.dctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:14px}
.dctl label{display:flex;align-items:center;gap:8px}
.dctl select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
.dlist{overflow:auto;flex:1}
.opt{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.opt:first-child{border-top:0}
.opt .thumb{width:56px;height:56px}
.opt .thumb svg{width:42px;height:42px}
.opt.cur{background:var(--accent-soft)}
.opt .name{font-size:15px;margin:0 0 4px}
.opt .delta{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.opt .price{font-size:16px;text-align:right}
.empty{padding:32px 20px;color:var(--ink2);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:1020px){
  .hero{grid-template-columns:minmax(0,1fr);gap:28px}
  .build{grid-template-columns:minmax(0,1fr)}
  .sum{position:static;max-height:none}
}
@media (max-width:640px){
  .row2{grid-template-columns:1fr}
  .row2.keep{grid-template-columns:1fr 1fr}
  .form{padding:16px}
  .stage{height:340px}
  .vctl{padding:16px}
  .vh{padding:14px 16px}
  .slot{grid-template-columns:64px minmax(0,1fr);padding:16px}
  .thumb{width:64px;height:64px}.thumb svg{width:46px;height:46px}
  .act{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;min-width:0}
  .alt{grid-column:1 / -1;justify-content:flex-start}
  .opt{grid-template-columns:48px minmax(0,1fr)}
  .opt .side{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:10px}
}

.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs a{padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink2);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.langsel{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 8px;font:600 13px var(--body);max-width:140px}
.open3d{display:flex;justify-content:center;margin-top:14px;text-decoration:none}
.v3d{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.stagebox{overflow:hidden;position:sticky;top:12px}
.vbar{padding:10px 14px;border-bottom:1px solid var(--line)}
.stagebox .stage{height:clamp(420px,72vh,760px)}
.hintline{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink2);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none}
.pick{position:absolute;left:12px;right:60px;top:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.pick .pk{display:grid;gap:2px;min-width:0}.pick .pc{color:var(--ink2);font-size:12px}.pick .pp{font-weight:600}
.pick .pb{display:flex;gap:6px;flex-wrap:wrap}
.pspec{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink2)}.pspec i{font-style:normal;opacity:.8}
.pick{max-width:calc(100% - 70px)}
.side3d{display:grid;gap:16px;min-width:0}
.pl{padding:16px}.pl h3{margin:0 0 8px;font:500 16px var(--display)}
.prow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 6px;border-radius:0;font-size:13.5px}
.prow:hover{background:var(--panel2)}
.prow[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.prow .pn{display:grid;min-width:0}.prow .pn i{font-style:normal;font-size:11.5px;color:var(--ink2)}.prow .pr{font-weight:600;white-space:nowrap}
.v3dt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px}
.side3d .vctl{grid-template-columns:1fr;padding:16px;border-top:0}
@media (max-width:1020px){.v3d{grid-template-columns:minmax(0,1fr)}.stagebox{position:static}.stagebox .stage{height:min(62vh,520px)}}
@media (max-width:640px){.tabs a{padding:7px 10px}.top{flex-wrap:wrap}}
.lead2{color:var(--ink2);margin:-6px 0 16px;max-width:70ch}
.pre-spec{padding:20px;margin-bottom:16px}.pre-spec h3,.pre-card h3{margin:0 0 8px;font:500 16px var(--display)}
.pre-q{font-weight:600;margin:0 0 6px}.pre-tot{margin:0 0 10px;color:var(--ink2)}.pre-tot b{color:var(--ink)}
.pre-list{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 20px;font-size:13.5px}.pre-list i{font-style:normal;color:var(--ink2);margin-right:6px}
.pre-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.pre-card{padding:20px}.pre-card.wide{grid-column:1/-1}.pre-card p{margin:0 0 12px;color:var(--ink2);font-size:14px}
.pre-btns{display:flex;flex-wrap:wrap;gap:8px}
.hs-filters{padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 28px;margin-bottom:16px}.hs-filters .grp{display:grid;gap:8px;align-content:start}.hs-filters .lbl{font-size:13px;font-weight:500;color:var(--ink2)}.hs-filters select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:0 8px}
.nb3{margin-bottom:18px}.nb3 .stagebox{position:relative;top:auto}.nb3 .stagebox .stage{height:clamp(300px,46vw,460px)}.us-row{display:flex;gap:8px}.us-row .inp{flex:1;min-width:0}.hs-filters .grp.wide{grid-column:1/-1}.us-est{margin:0 0 10px;font-size:15px}.pre-card .us-h2{margin-top:20px}.us-tips{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;line-height:1.5}.muted{color:var(--ink2);font-size:13px;margin:0}
.hs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}

function makeProfile(purpose,budgetUSD,prefs){
  const P=Object.assign({white:0,compact:0,quiet:0,rgb:0,wifi:0,noGpu:0,cpuBrand:'any',gpuBrand:'any',minRamGB:0,minStorageGB:0,focus:'balanced'},prefs||{});
  P.purpose=purpose;P.budget=budgetUSD;
  let ram={gaming:budgetUSD<800?16:32,stream:32,office:16,programming:32,video:budgetUSD>2600?64:32,'3d':budgetUSD>2600?64:32,ai:budgetUSD>2600?64:32}[purpose]||16;
  let ssd={gaming:budgetUSD<600?500:1000,stream:1000,office:500,programming:1000,video:2000,'3d':budgetUSD<1500?1000:2000,ai:2000}[purpose]||500;
  P.ramGB=Math.max(ram,P.minRamGB||0);P.ssdGB=Math.max(ssd,P.minStorageGB||0);

function score(cpu,gpu,P){
  const gg=gpu?gpu.g:12,gr=gpu?gpu.r:8,ga=gpu?Math.min(100,gpu.r*.55+gpu.vram*2.2):6;
  switch(P.purpose){
    case 'gaming':{const w=P.focus==='gpu'?.75:P.focus==='cpu'?.5:.65;return(1-w)*cpu.g+w*gg;}
    case 'stream':return .2*cpu.g+.2*cpu.mt+.6*gg;
    case 'video':return .45*cpu.mt+.1*cpu.g+.45*gr;
    case '3d':return .3*cpu.mt+.7*gr;
    case 'ai':return .15*cpu.mt+.85*ga;
    default:return .8*cpu.mt+.1*cpu.g+.1*gg;
  }
}
function assemble(cpu,gpu,P){
  const mobos=MOBOS.filter(m=>m.socket===cpu.socket&&m.tier>=cpu.vrm&&(!P.compact||m.ff==='ITX')&&(!P.wifi||m.wifi)).sort(byPrice);
  if(!mobos.length)return null;
  const mobo=mobos[0];
  const rams=RAMS.filter(x=>x.type===mobo.mem);
  let rc=rams.filter(x=>x.gb>=P.ramGB);if(P.rgb&&rc.some(x=>x.rgb))rc=rc.filter(x=>x.rgb);
  const ram=rc.sort(byPrice)[0]||rams.slice().sort((a,b)=>b.gb-a.gb)[0];
  const ssd=SSDS.filter(x=>x.gb>=P.ssdGB).sort(byPrice)[0]||SSDS.slice().sort((a,b)=>b.gb-a.gb)[0];
  let cases=CASES.filter(c=>FF[mobo.ff]<=FF[c.ff]&&(!gpu||gpu.len<=c.gpu)&&(!P.white||c.color==='white')&&(P.compact?c.ff==='ITX':c.ff!=='ITX'));
  const pick=(pred)=>{const x=cases.filter(pred);if(x.length)cases=x;};
  if(P.quiet)pick(c=>c.quiet);
  if(P.rgb)pick(c=>c.rgb);
  cases.sort(byPrice);
  const n=needW(cpu,gpu),premium=P.budget>1200||(gpu&&gpu.pw>=200);
  for(const cs of cases){
    const cooler=COOLERS.filter(k=>k.rating>=Math.round(cpu.pw*.9)&&(k.type==='air'?k.height<=cs.cooler:cs.rad.includes(k.rad))).sort(byPrice)[0];
    if(!cooler)continue;
    const psu=PSUS.filter(p=>p.w>=n&&cs.psu.includes(p.form)&&(!premium||p.eff!=='Bronze')).sort(byPrice)[0];
    if(!psu)continue;
    return{cpu,gpu,mobo,ram,ssd,psu,case:cs,cooler};
  }
  return null;
}
function allowed(k,c,P){
  if(k==='mobo'&&P.wifi&&!c.wifi)return false;
  if(k==='case'){if(P.white&&c.color!=='white')return false;if(!!P.compact!==(c.ff==='ITX'))return false;}
  return true;
}
function upgrade(b,P){
  const order=['ssd','ram','cooler','psu','case','mobo'];
  for(let round=0;round<2;round++){
    for(const k of order){
      const left=P.budget-totalUSD(b);if(left<=0)return;
      const cur=b[k];let best=null;
      for(const c of POOL[k]){
        if(c.price<=cur.price||c.price-cur.price>left*(round?1:.55))continue;
        if(!allowed(k,c,P))continue;
        if(k==='ram'&&c.gb>Math.max(P.ramGB*2,32))continue;
        if(k==='ssd'&&c.gb>Math.max(P.ssdGB*2,2000))continue;
        if(k==='case'&&(c.ff==='ITX')!==(cur.ff==='ITX'))continue;
        if(k==='mobo'&&(c.ff==='ITX')!==(cur.ff==='ITX'))continue;
        if(errCount({...b,[k]:c}))continue;
        if(!best||c.price>best.price)best=c;
      }
      if(best)b[k]=best;
    }
  }
}
function buildPC(P){
  let best=null,bestS=-1,minB=null,minT=Infinity;
  const cpus=CPUS.filter(c=>P.cpuBrand==='any'||c.brand.toLowerCase()===P.cpuBrand);
  let gpus=GPUS.filter(g=>P.gpuBrand==='any'||g.brand.toLowerCase()===P.gpuBrand);
  const igpuOK=P.noGpu||P.purpose==='office'||P.purpose==='programming';
  for(const cpu of cpus){
    const opts=gpus.slice();if(igpuOK&&cpu.igpu)opts.push(null);
    for(const gpu of opts){
      const b=assemble(cpu,gpu,P);if(!b)continue;
      const tot=totalUSD(b);
      if(tot<minT){minT=tot;minB=b;}
      if(tot<=P.budget){const s=score(cpu,gpu,P);if(s>bestS||(s===bestS&&tot<totalUSD(best))){bestS=s;best=b;}}
    }
  }
  let over=false;
  if(!best){best=minB;over=true;}
  if(!best)return null;
  if(!over)upgrade(best,P);
  return{build:best,over,minUSD:minT};
}
function autoFix(b0,locked){
  const price=b=>totalUSD(b);
  function dfs(b,depth){
    const errs=check(b).filter(x=>x.level==='error');
    if(!errs.length||depth===0)return{b,n:errs.length,d:Math.abs(price(b)-price(b0))};
    let best=null;
    for(const s of errs[0].slots){
      if(s===locked)continue;
      const cands=POOL[s].slice();if(s==='gpu'&&b.cpu.igpu)cands.push(null);
      for(const c of cands){
        if(c===b[s])continue;
        const nb={...b,[s]:c};
        if(errCount(nb)>errs.length)continue;
        const r=dfs(nb,depth-1);
        if(!best||r.n<best.n||(r.n===best.n&&r.d<best.d))best=r;
        if(best.n===0&&best.d===0)return best;
      }
    }
    if(!best||best.n>errs.length)return{b,n:errs.length,d:Math.abs(price(b)-price(b0))};
    return best;
  }
  return dfs({...b0},4).b;
}

  const tb=s.match(/(\d)\s?(tb|тб)/);if(tb)o.minStorageGB=+tb[1]*1000;

  else if(/3d|блендер|blender|рендер|render/.test(s))purpose='3d';

  return{prefs:o,purpose};
}

function wake(){if(V.ok&&!V.raf&&V.visible&&!document.hidden){V.last=performance.now();V.raf=requestAnimationFrame(tick);}}
function tick(ts){
  V.raf=0;if(!V.ok||!V.visible||document.hidden)return;
  const dt=Math.min(.05,(ts-V.last)/1000||0);V.last=ts;
  const now=performance.now();
  let moving=false;
  if(V.goal){
    let dy=V.goal.yaw-V.yaw;dy=((dy+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    V.yaw+=dy*Math.min(1,dt*6);V.pitch+=(V.goal.pitch-V.pitch)*Math.min(1,dt*6);
    if(Math.abs(dy)<.003&&Math.abs(V.goal.pitch-V.pitch)<.003)V.goal=null;moving=true;
  }else if(!V.ptrs.size&&(Math.abs(V.yv)>.0004||Math.abs(V.pv)>.0004)){
    V.yaw+=V.yv;V.pitch=Math.max(-.2,Math.min(1.45,V.pitch+V.pv));V.yv*=.92;V.pv*=.9;moving=true;
  }else if(S.v.auto&&!V.ptrs.size&&now>V.idle){V.yaw+=dt*.22;moving=true;}
  if(S.v.spin&&V.fans.length){for(const f of V.fans)f.rotation.z+=dt*10;moving=true;}
  if(lightMode()==='rainbow'){V.hue=(V.hue+dt*.2)%1;applyLights();moving=true;}
  if(Math.abs(V.exT-V.exC)>.002){V.exC+=(V.exT-V.exC)*Math.min(1,dt*6);applyExplode();moving=true;}
  if(V.helper)V.helper.update();
  if(V.tgoal){
    const k=Math.min(1,dt*5),g=V.tgoal;
    V.tx+=(g[0]-V.tx)*k;V.ty+=(g[1]-V.ty)*k;V.tz+=(g[2]-V.tz)*k;V.dist+=(V.dgoal-V.dist)*k;
    if(Math.abs(g[0]-V.tx)+Math.abs(g[1]-V.ty)+Math.abs(g[2]-V.tz)+Math.abs(V.dgoal-V.dist)<.05)V.tgoal=null;

  }
  const cp=Math.cos(V.pitch);
  V.cam.position.set(V.tx+V.dist*Math.sin(V.yaw)*cp,V.ty+V.dist*Math.sin(V.pitch),V.tz+V.dist*Math.cos(V.yaw)*cp);

}
function setView(name){const v=VIEWS[name];if(!v)return;V.goal={yaw:v.yaw,pitch:v.pitch};V.idle=performance.now()+5000;wake();}
function resetDist(){V.dist=baseDist();}
function baseDist(){const dm=CDIM[(S.build&&S.build.case.ff)||'ATX'];return Math.max(dm.h*2.75,dm.d*2.2);}
function resetView(){V.tgoal=[0,-2,0];V.dgoal=baseDist();setView('iso');}
function focusPart(slot){

function pickAt(cx,cy){
  if(!V.root)return null;

  for(const h of hits){
    let o=h.object;if(o.userData&&o.userData.noPick)continue;

/* ---------- model construction ---------- */
function rrShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-Math.PI/2,0,false);
  s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,Math.PI/2,false);
  s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI,false);
  s.lineTo(x,y+r);s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5,false);
  return s;
}
function rbGeo(sx,sy,sz,r){
  const key='rb'+[sx,sy,sz,r].join('|');let g=V.geo.get(key);if(g)return g;
  const bv=Math.max(.02,Math.min(.07,sz*.3,(r||.1)*.5));
  const w=sx-2*bv,hh=sy-2*bv,rr=Math.max(.01,Math.min(r-bv,w/2-.001,hh/2-.001));
  const depth=Math.max(.01,sz-2*bv);
  g=new THREE.ExtrudeGeometry(rrShape(w,hh,rr),{depth:depth,bevelEnabled:true,bevelThickness:bv,bevelSize:bv,bevelSegments:2,curveSegments:5});
  g.translate(0,0,-depth/2);V.geo.set(key,g);return g;
}
function canvasTex(w,h,draw,repeat){

}
function textTex(text,fg,font,aspect){
  const W=512,H=Math.max(32,Math.round(512/aspect));

function shortName(p){

  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('keydown',e=>{const k={ArrowLeft:[-.15,0],ArrowRight:[.15,0],ArrowUp:[0,-.1],ArrowDown:[0,.1]}[e.key];if(k){e.preventDefault();LV.yaw+=k[0];LV.pitch=Math.max(.02,Math.min(1.4,LV.pitch+k[1]));lvWake();}});
  const zoom=f=>{LV.dist=Math.max(LV.baseD*.35,Math.min(LV.baseD*2.2,LV.dist*f));LV.userZoom=true;lvWake();};
  $('nb3In').addEventListener('click',()=>zoom(.85));$('nb3Out').addEventListener('click',()=>zoom(1.18));
  $('nb3Ang').addEventListener('input',e=>{LV.ang=+e.target.value;lvWake();});
  $('nb3Spin').addEventListener('change',e=>{LV.spin=e.target.checked;lvWake();});
  $('nb3Rgb').addEventListener('change',e=>{LV.rgb=e.target.checked;if(LV.glow)LV.glow.visible=LV.rgb;lvWake();});
  $('nb3Sw').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;LV.color=b.dataset.c;lvUI();lvBuild();});
  LV.init=true;
}
function lvWake(){if(!LV.raf&&LV.ok)LV.raf=requestAnimationFrame(lvTick);}
function lvTick(ts){
  LV.raf=0;if(!LV.ok||!LV.visible||document.hidden)return;
  const dt=Math.min(.05,(ts-LV.last)/1000||0);LV.last=ts;let mv=false;
  if(!LV.ptrs.size&&(Math.abs(LV.yv)>.0004||Math.abs(LV.pv)>.0004)){LV.yaw+=LV.yv;LV.pitch=Math.max(.02,Math.min(1.4,LV.pitch+LV.pv));LV.yv*=.92;LV.pv*=.9;mv=true;}
  else if(LV.spin&&!LV.ptrs.size){LV.yaw+=dt*.4;mv=true;}
  if(Math.abs(LV.ang-LV.angC)>.1){LV.angC+=(LV.ang-LV.angC)*Math.min(1,dt*8);lvLid();mv=true;}
  if(LV.rgb&&LV.rgbTex&&LV.sp&&LV.sp.gam){LV.rgbTex.offset.x=(LV.rgbTex.offset.x+dt*.12)%1;mv=true;}
  const cp=Math.cos(LV.pitch);
  LV.cam.position.set(LV.dist*Math.sin(LV.yaw)*cp,LV.ty+LV.dist*Math.sin(LV.pitch),LV.dist*Math.cos(LV.yaw)*cp);
  LV.cam.lookAt(0,LV.ty,0);LV.rend.render(LV.scene,LV.cam);
  if(mv||LV.ptrs.size)LV.raf=requestAnimationFrame(lvTick);
}
function lvUI(){
  const h=NB.find(x=>x.id===LV.id);
  if(h)$('nb3Sel').textContent=t('nb3_sel')+': '+h.brand+' '+h.name;
  $('nb3Sw').innerHTML=LV_COL.map(c=>`<button type="button" data-c="${c[0]}" style="background:${c[1]}" aria-label="${esc(t('nb3_c_'+c[0]))}" title="${esc(t('nb3_c_'+c[0]))}" aria-pressed="${LV.color===c[0]}"></button>`).join('');
  $('nb3Spin').checked=LV.spin;$('nb3Rgb').checked=LV.rgb;
}
function lvSelect(id){
  const h=NB.find(x=>x.id===id);if(!h)return;
  LV.id=id;LV.color=lvDefaultColor(h);LV.rgb=h.uses.includes('g');
  lvUI();lvBuild();
}
function lvEnsure(){
  if(!LV.init)lvInit();
  if(LV.ok&&!LV.id)lvSelect('mba13');else if(LV.ok)lvWake();
}

/* ============ EVENTS ============ */
function toast(msg){const e=$('toast');e.textContent=msg;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true;},2400);}
function listText(){
  const b=S.build;
  const rows=SLOTS.map(k=>`${t('s_'+k)}: ${b[k]?b[k].name+' — '+money(b[k].price):t('integrated')}`);
  const tot=SLOTS.reduce((s,k)=>s+(b[k]?lp(b[k].price):0),0);
  return 'PC Builder AI\n'+rows.join('\n')+'\n'+t('total')+': '+fmt(tot);
}
async function copyList(){
  const text=listText();
  try{await navigator.clipboard.writeText(text);toast(t('copied'));}
  catch(e){
    try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?t('copied'):t('copyFail'));}
    catch(e2){toast(t('copyFail'));}
  }
}
function init(){
  const saved=store.get();
  let nav=(navigator.language||'en').toLowerCase();nav=nav.startsWith('fil')?'fil':nav.slice(0,2);nav={nb:'no',nn:'no',tl:'fil'}[nav]||nav;
  const okL=c=>LANGS.some(a=>a[0]===c);S.lang=okL(saved.lang)?saved.lang:(okL(nav)?nav:'en');
  S.theme=saved.theme||null;
  if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);
  if(saved.country&&COUNTRIES.some(c=>c.code===saved.country)){S.country=saved.country;S.currency=saved.currency&&CURRENCIES[saved.currency]?saved.currency:country().cur;S.rate=+saved.rate>0?+saved.rate:CURRENCIES[S.currency][0];S.budget=+saved.budget>0?+saved.budget:Math.round(1000*S.rate/step())*step();S.city=saved.city||'';S.purpose=saved.purpose||'gaming';S.desc=saved.desc||'';}
  else{
    const defC={ru:'RU',tr:'TR',en:'US',uk:'UA',de:'DE',es:'ES',fr:'FR',az:'AZ',ar:'SA',it:'IT',ja:'JP',ko:'KR',zh:'CN',pl:'PL',cs:'CZ',nl:'NL',pt:'BR',hi:'IN',hy:'AM',ka:'GE',kk:'KZ',ky:'KG',tg:'TJ',uz:'UZ',sv:'SE'}[S.lang]||'US';S.country=defC;S.currency=country().cur;S.rate=CURRENCIES[S.currency][0];S.budget=Math.round(1000*S.rate/step())*step();
  }
  if(saved.v&&typeof saved.v==='object')Object.assign(S.v,saved.v);
  if(RM&&!(saved.v&&'spin' in saved.v)){S.v.spin=false;S.v.auto=false;}
  fillCurrencies();
  $('desc').value=S.desc;$('city').value=S.city;
  applyI18n();

  $('langSel').innerHTML=LANGS.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');$('langSel').value=S.lang;
  $('langSel').addEventListener('change',e=>{S.lang=e.target.value;save();$('city').value=S.city;applyI18n();renderResult();refreshTabs();});
  $('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme=dark?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme);save();
  });
  $('country').addEventListener('change',e=>{S.country=e.target.value;S.city='';$('city').value='';fillCities();setCurrency(country().cur,true);save();if(S.build)renderResult();refreshTabs();});
  $('city').addEventListener('input',e=>{S.city=e.target.value;save();});
  $('currency').addEventListener('change',e=>{setCurrency(e.target.value,true);save();if(S.build)renderResult();refreshTabs();});
  $('rate').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(v>0){S.rate=v;const sl=$('slider');sl.value=Math.max(300,Math.min(5000,Math.round(budgetUSD()/50)*50));}});
  $('rate').addEventListener('change',()=>{syncBudget();save();});
  $('budget').addEventListener('input',e=>{const v=parseFloat(e.target.value);if(v>0){S.budget=v;$('slider').value=Math.max(300,Math.min(5000,Math.round(budgetUSD()/50)*50));}});
  $('budget').addEventListener('change',()=>{save();});
  $('slider').addEventListener('input',e=>{S.budget=Math.round(+e.target.value*S.rate/step())*step();$('budget').value=S.budget;save();});
  $('purposes').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;S.purpose=b.dataset.p;save();document.querySelectorAll('#purposes .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('examples').addEventListener('click',e=>{const b=e.target.closest('[data-ex]');if(!b)return;$('desc').value=t('ex'+b.dataset.ex);S.desc=$('desc').value;save();$('desc').focus();});
  $('desc').addEventListener('input',e=>{S.desc=e.target.value;save();});
  $('form').addEventListener('submit',e=>{e.preventDefault();run();});
  $('parts').addEventListener('click',e=>{const b=e.target.closest('[data-swap]');if(b)openSwap(b.dataset.swap);});
  $('sum').addEventListener('click',e=>{
    if(e.target.closest('#fixBtn')){
      S.build=autoFix(S.build,S.lastChanged);renderResult();
      toast(errCount(S.build)?t('fixPart'):t('fixDone'));
    }else if(e.target.closest('#copyBtn'))copyList();
    else if(e.target.closest('#resetBtn')&&S.orig){S.build={...S.orig};S.lastChanged=null;renderResult();}
  });
  $('mClose').addEventListener('click',closeSwap);
  $('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeSwap();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeSwap();});
  $('mOnly').addEventListener('change',e=>{swap.only=e.target.checked;renderSwap();});
  $('mSort').addEventListener('change',e=>{swap.sort=e.target.value;renderSwap();});
  $('mList').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b)pick(+b.dataset.pick);});

  $('view3d').addEventListener('click',e=>{
    const sel=e.target.closest('[data-sel]'),sw3=e.target.closest('[data-swap3]'),un=e.target.closest('[data-unsel]'),fo=e.target.closest('[data-focus]'),c=e.target.closest('[data-col]'),lc=e.target.closest('[data-lc]'),lm=e.target.closest('[data-lm]'),vw=e.target.closest('[data-view]'),cs=e.target.closest('[data-case]');
    if(sel){const k=sel.dataset.sel;if(V.sel===k)focusPart(k);else selectPart(k);}
    else if(sw3){openSwap(sw3.dataset.swap3);}
    else if(fo){focusPart(fo.dataset.focus);}
    else if(un){selectPart(null);}
    else if(c){const k=c.dataset.col;if(k==='auto'){S.v.color=null;S.v.colorKey=null;}else{S.v.colorKey=k;S.v.color=SWATCH.find(a=>a[0]===k)[1];}save();viewUpdate();}
    else if(lc){S.v.lc=lc.dataset.lc;if(S.v.light==='off'||S.v.light==='rainbow'||!S.v.light)S.v.light='static';save();renderViewerUI();applyLights();wake();}
    else if(lm){S.v.light=lm.dataset.lm;save();renderViewerUI();applyLights();wake();}
    else if(vw)setView(vw.dataset.view);
    else if(cs){const alt=CASES.find(x=>x.id===cs.dataset.case);if(alt){S.build={...S.build,case:alt};S.lastChanged='case';S.aiText=null;S.aiNote='';S.v.color=null;S.v.colorKey=null;renderResult();}}
  });
  $('view3d').addEventListener('input',e=>{
    if(e.target.id==='colCustom'){S.v.color=e.target.value;S.v.colorKey='custom';save();if(V.ok){buildModel();wake();}}
    else if(e.target.id==='lcCustom'){S.v.lc=e.target.value;if(!S.v.light||S.v.light==='off')S.v.light='static';save();applyLights();wake();}
  });
  $('view3d').addEventListener('change',e=>{
    const id=e.target.id;
    if(id==='glassSel'){S.v.glass=e.target.value;save();if(V.ok){buildModel();wake();}}
    else if(id==='spinCk'){S.v.spin=e.target.checked;save();wake();}
    else if(id==='autoCk'){S.v.auto=e.target.checked;save();wake();}
    else if(id==='vertCk'){S.v.vert=e.target.checked;save();if(V.ok){buildModel();wake();}}
    else if(id==='colCustom'||id==='lcCustom'){renderViewerUI();}
  });
  $('zIn').addEventListener('click',()=>{V.dist=Math.max(10,V.dist*.88);wake();});
  $('vReset').addEventListener('click',()=>{resetView();});
  $('expSl').addEventListener('input',e=>{V.exT=+e.target.value/100;wake();});
  window.addEventListener('hashchange',route);hsEvents();nbEvents();usedEvents();
  $('zOut').addEventListener('click',()=>{V.dist=Math.min(230,V.dist*1.14);wake();});

  // example build on load (built-in engine, no AI call)
  const P=makeProfile(S.purpose==='other'?'gaming':S.purpose,budgetUSD(),parseLocal(S.desc).prefs);
  const res=buildPC(P);
  S.build=res.build;S.orig={...res.build};S.over=res.over;S.minUSD=res.minUSD;S.shownPurpose=P.purpose;
  renderResult();

  route();

  // ask Claude: available only inside the viewer
  try{
    if(window.claude&&window.claude.use){
      window.claude.use('sample').then(f=>{sample=f||null;}).catch(()=>{sample=null;});
    }
  }catch(e){sample=null;}
}
init();
})();
</script>
